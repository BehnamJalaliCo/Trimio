org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# R8 pulls a whole app graph through one pass; without its own head the release build dies mid-assemble.
android.r8.maxMemory=4g
# At most three heavy workers beside the daemon (Kotlin compile, R8): a CI runner has cores, not memory to spare.
org.gradle.workers.max=3

kotlin.code.style=official
# iOS targets are declared for future builds but can only be compiled on macOS.
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true
