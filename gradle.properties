org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# R8 pulls a whole app graph through one pass; its own head keeps the release build from dying mid-assemble.
# 6g for the four release assemble/bundle tasks (play+bazaar, apk+aab) in one invocation; the daemon stays at 4g.
android.r8.maxMemory=6g
# Two heavy compiles beside the daemon: the jvmTest tasks take a 4g heap of their own.
org.gradle.workers.max=2

kotlin.code.style=official
# iOS targets are declared for future builds but can only be compiled on macOS.
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true
