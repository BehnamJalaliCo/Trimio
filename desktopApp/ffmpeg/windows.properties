# The ffmpeg/ffprobe build bundled with the Windows app (docs/DESKTOP.md, "ffmpeg and licensing").
#
# BtbN/FFmpeg-Builds "lgpl" variant: static win64 binaries of an FFmpeg release branch built WITHOUT
# --enable-gpl (no libx264/libx265), so the bundle stays LGPL-2.1-or-later. H.264 is encoded with the
# operating system's Media Foundation encoder (h264_mf), audio with FFmpeg's native AAC encoder.
#
# Pinning: BtbN keeps the last build of each month for two years. Set `tag` to such a monthly
# autobuild tag, `asset` to its win64-lgpl zip, and `sha256` to the hash the workflow prints on its
# first run (it also checks the release's own checksums.sha256). Tag builds refuse to package with an
# empty sha256; manual runs warn and print the hash to pin.
tag=latest
asset=ffmpeg-n8.0-latest-win64-lgpl-8.0.zip
sha256=
