<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="sig.css">
<style>html,body{margin:0;background:#0B0A09}.phone{border-radius:0;box-shadow:none;width:390px;height:844px}
.st{display:flex;justify-content:space-between;align-items:center;height:34px;color:var(--mute);font:500 13.5px 'UI'}
.st .n{font:500 11px 'ACC';color:var(--dim);margin-left:10px;direction:ltr;display:inline-block}
.st .tm{font:600 11px 'ACC';direction:ltr}
.st.run{height:40px;color:var(--ink);font-weight:800;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.st.run .n,.st.run .tm{color:var(--em)} .st.wait{color:var(--dim)}
.w{transition:none}
</style></head>
<body>
<div class="phone grain">
  <div class="top"></div>
  <div class="pad row sb" style="margin-top:8px"><div class="lfa">در حال ساخت · نوآر</div><div style="font:600 13px 'UI'">لغو</div></div>
  <div class="pad" style="margin-top:18px; display:flex; align-items:flex-end; justify-content:space-between">
    <div style="display:flex; align-items:flex-start; direction:ltr">
      <span id="pct" style="font:1000 140px/.86 'DSP'; letter-spacing:-.03em">۰</span>
      <span style="font:900 30px 'ACC'; color:var(--em); margin-top:4px">%</span>
    </div>
    <div class="shot" style="width:100px; height:178px; border-radius:16px; box-shadow:0 0 0 1px var(--line2), 0 20px 40px rgba(0,0,0,.6)">
      <div id="kb" style="position:absolute; inset:0"><div class="key"></div><div class="sub"></div></div>
      <div id="w1" style="position:absolute; z-index:4; bottom:40px; right:10px; font:1000 22px/1 'DSP'; opacity:0">پنج</div>
      <div id="w2" style="position:absolute; z-index:4; bottom:14px; right:10px; font:1000 20px/.9 'DSP'; color:#0B0A09; background:var(--acid); padding:8px 4px 2px; opacity:0">درصد</div>
      <div style="position:absolute; z-index:4; top:9px; left:9px; font:700 8.5px 'ACC'; letter-spacing:.2em; color:var(--acid); direction:ltr" id="live">● LIVE</div>
    </div>
  </div>
  <div class="pad" style="margin-top:16px; display:flex; gap:3px; direction:ltr" id="segs"></div>
  <div class="pad row sb" style="margin-top:8px"><span class="lfa" id="frames">۰ از ۳۱۵ فریم</span><span class="lfa" id="eta">حدود ۷۰ ثانیه</span></div>
  <div class="pad" style="margin-top:16px">
    <div class="glass" style="border-radius:20px; padding:14px 16px; min-height:118px">
      <div class="row" style="gap:8px"><span class="dd" id="dd" style="width:14px;height:14px"></span><span style="font:700 12px 'UI'" class="iri" id="scene">کارگردان · صحنهٔ ۱ از ۷</span></div>
      <div id="dtext" style="font:500 14.5px/1.75 'UI'; margin-top:8px"></div>
    </div>
  </div>
  <div class="pad" style="margin-top:14px" id="stages"></div>
  <div class="pad" style="margin-top:10px"><div id="tr" style="font:500 15px/1.9 'UI'; color:var(--mute)"></div></div>
</div>
<script src="icons.js"></script>
<script src="motion.js"></script>
<script>
const fa = n => Math.floor(n).toLocaleString('fa-IR');
const segs = document.getElementById('segs');
for (let i = 0; i < 34; i++) { const d = document.createElement('div'); d.style.cssText = 'flex:1;height:22px;border-radius:2px;background:rgba(242,237,228,.08)'; segs.appendChild(d); }
const stages = [['01','شنیدن و پاک‌سازی',0,900,'2.1s'],['02','کلمه‌به‌کلمه',900,2600,'9.4s'],['03','طراحی صحنه‌ها',2600,4200,'6.2s'],['04','رندر موشن‌گرافی',4200,9000,''],['05','بازبینی با چشم کارگردان',9000,9999,'']];
const lines = [
  [0, 'صحنهٔ ۱ از ۷', 'هوک: «بیت‌کوین» با زوم ضربه‌ای در ثانیهٔ اول، روی ضرب اول موسیقی.'],
  [2600, 'صحنهٔ ۳ از ۷', '«پنج درصد» را با شمارندهٔ عدد و ضربهٔ بیس می‌سازم؛ کلمه با هایلایت لیمویی می‌نشیند.'],
];
const words = ['امروز','بیت‌کوین','پنج درصد','رشد کرد','و','سیگنال خرید','ما','به','اولین','تارگت','رسید'];
window.custom = t => {
  // percentage: fast start, settles (ease) — 0..68 across 0..8s
  const p = 68 * (1 - Math.pow(1 - Math.min(1, t / 8000), 2.2));
  document.getElementById('pct').textContent = fa(p);
  const lit = Math.floor(p / 100 * 34);
  [...segs.children].forEach((d, i) => d.style.background = i < lit ? '#FF5B2E' : (i === lit ? (Math.floor(t / 300) % 2 ? '#D7FF3A' : 'rgba(215,255,58,.45)') : 'rgba(242,237,228,.08)'));
  const fr = p / 68 * 214; document.getElementById('frames').textContent = fa(fr) + ' از ۳۱۵ فریم';
  document.getElementById('eta').textContent = 'حدود ' + fa(Math.max(40, 70 - t / 300)) + ' ثانیه';
  // ken burns on the live frame + words appearing
  document.getElementById('kb').style.transform = `scale(${1 + t / 60000})`;
  const a1 = Math.min(1, Math.max(0, (t - 4400) / 300)), a2 = Math.min(1, Math.max(0, (t - 4700) / 260));
  const w1 = document.getElementById('w1'), w2 = document.getElementById('w2');
  w1.style.opacity = a1; w1.style.transform = `translateY(${(1 - a1) * 10}px)`;
  w2.style.opacity = a2; w2.style.transform = `scale(${0.8 + 0.2 * (1 - Math.exp(-6 * a2) * Math.cos(9 * a2))})`; w2.style.transformOrigin = 'right bottom';
  document.getElementById('live').style.opacity = Math.floor(t / 500) % 2 ? 1 : .45;
  document.getElementById('dd').style.transform = `scale(${1 + 0.15 * Math.sin(t / 220)})`;
  // director narration: word-by-word
  const L = t >= 2600 ? lines[1] : lines[0];
  document.getElementById('scene').textContent = 'کارگردان · ' + L[1];
  const ws = L[2].split(' '); const n = Math.min(ws.length, Math.floor((t - L[0]) / 110) + 1);
  document.getElementById('dtext').innerHTML = ws.slice(0, n).map((w, i) => `<span style="opacity:${i === n - 1 ? .5 : 1}">${w}</span>`).join(' ').replace('هایلایت', '<span class="hl">هایلایت').replace('لیمویی', 'لیمویی</span>');
  // stages
  document.getElementById('stages').innerHTML = stages.map(([no, name, s, e, tm]) => {
    const cls = t >= e ? 'st' : (t >= s ? 'st run' : 'st wait');
    const right = t >= e ? tm + ' ✓' : (t >= s ? 'RUNNING' : '—');
    return `<div class="${cls}" style="border-top:1px solid var(--line)"><span><span class="n">${no}</span>${name}</span><span class="tm">${right}</span></div>`;
  }).join('');
  // transcript lights up as it is heard (stage 2)
  const k = Math.min(words.length, Math.max(0, Math.floor((t - 900) / 150)));
  document.getElementById('tr').innerHTML = words.map((w, i) => {
    if (i >= k) return `<span style="opacity:.18">${w}</span>`;
    if (w === 'پنج درصد') return `<span style="color:var(--acid);font-weight:900">${w}</span>`;
    if (w === 'بیت‌کوین' || w === 'سیگنال خرید') return `<span style="color:var(--ink);font-weight:900">${w}</span>`;
    return w;
  }).join(' ');
};
</script>
</body></html>
