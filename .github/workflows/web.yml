name: Web

# Builds the Compose-for-Wasm web app on every change; publishes it to GitHub Pages from main
# (or on demand). Enable Pages with source "GitHub Actions" in the repository settings first.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

# Decrypts the licensed brand fonts (brand/assets.bin); builds fall back to open fonts without it.
env:
  TRIMIO_BRAND_KEY: ${{ secrets.TRIMIO_BRAND_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the site
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Add legal pages
        run: |
          SITE=webApp/build/dist/wasmJs/productionExecutable
          mkdir -p "$SITE/legal"
          cp docs/legal/*.md "$SITE/legal/"
          ls -la "$SITE"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
