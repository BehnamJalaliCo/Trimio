name: Release

# Every change pushed to a working branch becomes a new numbered version, 1.0.N, for Android and
# Windows, published as a GitHub release vN (Android first, the Windows installers added after) with:
#   trimio-<v>.apk               install directly on the phone (updates the installed app; models stay)
#   trimio-<v>-play.aab          Google Play upload
#   trimio-<v>-bazaar.aab/.apk   Cafe Bazaar upload
#   Trimio-<v>.exe               Windows installer (upgrades in place, models stay; uninstall removes all app data)
# Android builds are all signed with the one upload key, and the version code only grows, so each
# version installs over the last. See docs/RELEASING.md for the secrets.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIMIO_BRAND_KEY: ${{ secrets.TRIMIO_BRAND_KEY }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        # 1.0.N with N this workflow's run number; Android's code 1000000 + N only ever grows.
        run: |
          echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.TRIMIO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::TRIMIO_KEYSTORE_BASE64 is not set (see docs/RELEASING.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "TRIMIO_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Signed APK and store bundles
        env:
          TRIMIO_KEYSTORE_PASSWORD: ${{ secrets.TRIMIO_KEYSTORE_PASSWORD }}
          TRIMIO_KEY_ALIAS: ${{ secrets.TRIMIO_KEY_ALIAS }}
          TRIMIO_KEY_PASSWORD: ${{ secrets.TRIMIO_KEY_PASSWORD }}
          BAZAAR_RSA_KEY: ${{ secrets.TRIMIO_BAZAAR_RSA_KEY }}
          VERSION: ${{ needs.version.outputs.name }}
          CODE: ${{ needs.version.outputs.code }}
        run: |
          ./gradlew :androidApp:assemblePlayRelease :androidApp:bundlePlayRelease :androidApp:bundleBazaarRelease :androidApp:assembleBazaarRelease \
            -Ptrimio.versionName="$VERSION" -Ptrimio.versionCode="$CODE" -Ptrimio.bazaarRsaKey="$BAZAAR_RSA_KEY"
          mkdir -p dist
          cp androidApp/build/outputs/apk/play/release/*.apk "dist/trimio-$VERSION.apk"
          cp androidApp/build/outputs/bundle/playRelease/*.aab "dist/trimio-$VERSION-play.aab"
          cp androidApp/build/outputs/bundle/bazaarRelease/*.aab "dist/trimio-$VERSION-bazaar.aab"
          cp androidApp/build/outputs/apk/bazaar/release/*.apk "dist/trimio-$VERSION-bazaar.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: trimio-android
          path: dist/*

  windows:
    needs: version
    uses: ./.github/workflows/desktop-windows.yml
    with:
      version: ${{ needs.version.outputs.name }}
    secrets: inherit

  # Android ships as soon as it is built; the Windows installers join the same release when ready.
  publish:
    needs: [version, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trimio-android
          path: dist

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS)
          NOTES="Trimio $VERSION from ${GITHUB_SHA::7}. Installs over the previous version; downloaded models stay. Windows installers are added when their build finishes."
          gh release create "v$VERSION" dist/*.apk dist/*.aab dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Trimio $VERSION" --notes "$NOTES"

  publish-windows:
    needs: [version, windows, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trimio-windows-installers
          path: win

      - name: Add the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          find win -type f -name '*.exe' -exec mv {} . \;
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS
          sha256sum *.exe >> SHA256SUMS
          gh release upload "v$VERSION" *.exe SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
