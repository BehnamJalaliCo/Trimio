name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Decrypts the licensed brand fonts (brand/assets.bin); builds fall back to open fonts without it.
env:
  TRIMIO_BRAND_KEY: ${{ secrets.TRIMIO_BRAND_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Static analysis (detekt, new findings only)
        run: ./gradlew detekt

      - name: Unit, shader, screenshot and golden-frame tests
        run: ./gradlew jvmTest :server:test

      - name: Compile web target
        run: ./gradlew compileKotlinWasmJs

      # AGP installs the pinned NDK and CMake on first use.
      - name: Assemble Android with native engines (both store flavors)
        run: ./gradlew :androidApp:assemblePlayDebug :androidApp:assembleBazaarDebug

      - name: Release build (R8) and licence audit
        run: ./gradlew :androidApp:assemblePlayRelease && ./gradlew --no-configuration-cache :androidApp:checkLicenses

      - name: Keep golden-frame diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: "**/build/golden-failures/"
          if-no-files-found: ignore

  native-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache test models
        uses: actions/cache@v4
        with:
          path: ~/.gradle/trimio-test-models
          key: test-models-whisper-tiny-lfm25-230m-v2

      - name: whisper.cpp through JNI on the host
        run: ./gradlew :engine:asr:jvmTest -Ptrimio.nativeTests --tests '*WhisperNativeTest*'

      - name: llama.cpp director through JNI on the host (grammar-constrained plans)
        run: ./gradlew :engine:llm:jvmTest :engine:director:jvmTest -Ptrimio.nativeTests
