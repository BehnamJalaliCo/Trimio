name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (shared code)
        run: ./gradlew jvmTest

      - name: Compile web target
        run: ./gradlew compileKotlinWasmJs

      - name: Assemble Android (both store flavors)
        run: ./gradlew :androidApp:assemblePlayDebug :androidApp:assembleBazaarDebug
