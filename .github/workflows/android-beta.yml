name: Android beta

# Every push to a working branch (or a manual run) builds an installable APK signed with the same
# upload key as the store releases, with a version code that only ever grows. A new beta therefore
# installs over the previous one as an update: app data — the downloaded models — stays on the
# phone, and nothing has to be uninstalled. The APK is attached to a pre-release named beta-<run>.
#
# Secrets (the same as Release): TRIMIO_KEYSTORE_BASE64, TRIMIO_KEYSTORE_PASSWORD, TRIMIO_KEY_ALIAS,
# TRIMIO_KEY_PASSWORD; TRIMIO_BRAND_KEY for the brand fonts. Without the key the run stops: an APK
# signed with a throwaway key would refuse to update the installed one.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIMIO_BRAND_KEY: ${{ secrets.TRIMIO_BRAND_KEY }}

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.TRIMIO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::TRIMIO_KEYSTORE_BASE64 is not set (see docs/RELEASING.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "TRIMIO_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Signed beta APK
        env:
          TRIMIO_KEYSTORE_PASSWORD: ${{ secrets.TRIMIO_KEYSTORE_PASSWORD }}
          TRIMIO_KEY_ALIAS: ${{ secrets.TRIMIO_KEY_ALIAS }}
          TRIMIO_KEY_PASSWORD: ${{ secrets.TRIMIO_KEY_PASSWORD }}
        run: |
          # Betas count up from 10000 by run number and stay below the first store release
          # (1.0.0 = 1000000), so every beta updates the last and a release updates any beta.
          CODE=$((10000 + GITHUB_RUN_NUMBER))
          VERSION="0.9.${GITHUB_RUN_NUMBER}-beta"
          ./gradlew :androidApp:assemblePlayRelease -Ptrimio.versionName="$VERSION" -Ptrimio.versionCode="$CODE"
          mkdir -p dist
          cp androidApp/build/outputs/apk/play/release/*.apk "dist/trimio-$VERSION.apk"
          (cd dist && sha256sum * > SHA256SUMS)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pre-release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "beta-${GITHUB_RUN_NUMBER}" dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Trimio $VERSION" --notes "Beta from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Installs over the previous beta; models stay."
